name: Test

on: push

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start containers
      run: docker compose -f dc-test.yml up -d db_test
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.32'
        python-version: '3.14.3'
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install dependencies
      run: uv sync --locked --dev
      working-directory: ./backend
    - name: Run tests
      run: ENVIRONMENT=test uv run pytest -m "not integration"
      working-directory: ./backend
      env:
        TESTING: 1
    - name: Containers logs
      if: always()
      run: docker compose logs
    - name: Stop containers
      if: always()
      run: docker compose -f dc-test.yml down
  backend-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start containers
      run: docker compose -f dc-test.yml up -d
    - uses: astral-sh/setup-uv@v6
      with:
        version: '0.11.32'
        python-version: '3.14.3'
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install dependencies
      run: uv sync --locked --dev
      working-directory: ./backend
    - name: Wait for SOLR
      run: timeout 500 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8993/solr/)" != "200" ]]; do sleep 5; done' || false
    - name: Run tests
      run: ENVIRONMENT=test uv run pytest -m "integration"
      working-directory: ./backend
      env:
        TESTING: 1
        SOLR_URL: http://localhost:8993/solr/
    - name: Containers logs
      if: always()
      run: docker compose logs
    - name: Stop containers
      if: always()
      run: docker compose -f dc-test.yml down
