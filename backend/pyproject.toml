[project]
name = "eosc-search-service"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic",
    "asgi-lifespan",
    "async-lru",
    "cachetools",
    "cryptojwt",
    "fastapi[all]>=0.118.3,<1",
    "fastapi-sessions",
    "httpx",
    "oidcrp",
    "psycopg2-binary>=2.9.11,<3",
    "pydantic",
    "pydantic-settings",
    "sentry-sdk",
    "setuptools>=65,<82",
    "sqlalchemy",
    "stomp.py<9",
    "typer",
    "uvicorn",
]

[dependency-groups]
dev = [
    "black==25.11.0",
    "isort",
    "pylint",
    "pymarkdownlnt",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock",
    "schemathesis==4.33.1",
]

[tool.isort]
profile = "black"
src_paths = ["alembic", "app", "tests"]
skip_gitignore = true

[tool.pylint.'messages control']
enable=["useless-suppression"]
disable=["similarities"]
# Allow single- and two-character names
good-names-rgxs="^[_a-z][_a-z0-9]?$"
# pydantic issue workaround: https://github.com/samuelcolvin/pydantic/issues/1961
extension-pkg-whitelist = "pydantic"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--strict-markers"
markers = ["integration: mark the test as an integration test for easier exclusion"]
# new versions of pytest / pytest asyncio have different default which crashes most tests
asyncio_mode = "auto"


[tool.black]
line-length = 79

[tool.ruff]
line-length = 79
select = ["E", "F", "W", "I", "C90"]
#select = ["E"]